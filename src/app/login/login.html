<div class="card main-card">
  <form action=""  #form="ngForm" (ngSubmit)="login(form)">
    <div class="form-group mt-3">
      <label for="email">Email</label>
      <input class="form-control" name="email" type="email" ngModel #email="ngModel" required>
    </div>
    <div class="form-group mt-3">
      <label for="username">Username</label>
      <input class="form-control" name="username" type="text" ngModel #username="ngModel" required>
    </div>
    <div class="form-group mt-3">
        <label for="password">Password</label>
        <input class="form-control" type="password" name="password" ngModel #password="ngModel" required minlength="5">
    </div>
    <div class="form-group mt-3">
        <button class="btn btn-light">Log in</button>
    </div>
    <div class="form-group register mt-1 mb-2">
        <a routerLinkActive="active" routerLink="/register">Create an account.</a>
    </div>
    

    @if (email.touched && email.invalid) {
        <div class="error-control">
            <p>Email is invalid!</p>
        </div>
    }
    @if (username.touched && username.invalid) {
        <div class="error-control">
            <p>Username is invalid!</p>
        </div>
    }
    @if (password.touched && password.invalid) {
        <div class="error-control">
            <p>Password is invalid!</p>
        </div>
    }
  </form>
</div>
<ng-component></ng-component>
